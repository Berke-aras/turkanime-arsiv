        <div id="player-modal-controls-row">
          <button id="player-modal-playtoggle" type="button" aria-label="Oynat/Duraklat"><svg class="ic" aria-hidden="true"><use href="#i-play"/></svg></button>
          <button id="player-modal-mute" type="button" aria-label="Sessiz"><svg class="ic" aria-hidden="true"><use href="#i-volume"/></svg></button>
          <input id="player-modal-volume" type="range" min="0" max="1" value="1" step="0.05" title="Ses">
          <span id="player-modal-time">0:00 / 0:00</span>
          <span class="player-modal-controls-spacer"></span>
          <button id="player-modal-speed" type="button" title="Oynatma hızı">1x</button>
          <button id="player-modal-fullscreen" type="button" aria-label="Tam ekran"><svg class="ic" aria-hidden="true"><use href="#i-maximize"/></svg></button>
        </div>
      </div>
      <iframe id="player-modal-frame" src="" allow="autoplay; fullscreen" allowfullscreen loading="lazy"
        sandbox="allow-scripts allow-same-origin allow-presentation allow-orientation-lock allow-forms allow-top-navigation-by-user-activation"></iframe>
    </div>
  </div>
</div>
